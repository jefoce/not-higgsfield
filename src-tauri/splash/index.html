<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not Higgsfield</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #0b0d0c;
        --lime: #b7f34a;
        --muted: #7d877f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: var(--ink);
        color: #eef2ed;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
      }
      main {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .mark {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 10px;
        background: var(--lime);
        color: var(--ink);
        font-weight: 800;
        letter-spacing: -0.06em;
      }
      .copy {
        display: grid;
        gap: 3px;
      }
      .name {
        font-size: 15px;
        font-weight: 600;
      }
      .status {
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">NH</div>
      <div class="copy">
        <div class="name">Not Higgsfield</div>
        <div class="status">Starting...</div>
      </div>
    </main>
  </body>
</html>
