[package]
name = "not-higgsfield"
version = "0.2.1"
description = "Not Higgsfield desktop shell"
authors = ["jefoce"]
edition = "2021"
rust-version = "1.90"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-shell = "2.5.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "=2.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "2.12.1", default-features = false, features = ["json"] }
getrandom = "0.2.17"
dirs = "5.0.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
time = { version = "0.3.55", features = ["formatting"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }
