name: ci
run-name: >-
  CI ${{ github.event_name == 'pull_request' && format('#{0} {1}', github.event.number, github.event.pull_request.title)
  || github.ref_name }}

on:
  push:
    branches: [releases]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm deps
      - run: pnpm format:check
      - run: pnpm knip
      - run: pnpm test
      - run: pnpm build

  workflows:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 .github/workflows/*.yml
      - name: shellcheck
        run: shellcheck .github/scripts/*.sh
      - name: zizmor
        run: pipx run zizmor==1.31.1 --min-severity medium --min-confidence high .github/workflows
