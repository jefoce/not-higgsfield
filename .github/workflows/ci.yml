name: ci
run-name: >-
  CI ${{ github.event_name == 'pull_request' && format('#{0} {1}', github.event.number, github.event.pull_request.title)
  || github.ref_name }}

on:
  push:
    branches: [releases, '[0-9]*.[0-9]*.[0-9]*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  workflows:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 .github/workflows/*.yml
      - name: shellcheck
        run: shellcheck .github/scripts/*.sh
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: zizmor
        run: pipx run --python python3.12 zizmor==1.31.1 --min-severity medium --min-confidence high .github
