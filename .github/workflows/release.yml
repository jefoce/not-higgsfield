name: release
run-name: >-
  Release ${{ inputs.tag
  || startsWith(github.ref, 'refs/tags/') && github.ref_name
  || github.event.head_commit.message }}

on:
  push:
    branches: [releases]
    tags: ['v*-rc.*']
  workflow_dispatch:
    inputs:
      node_source:
        description: Node.js binary source
        type: choice
        options: [custom, official]
        default: custom
      reuse_sidecars_run_id:
        description: Run ID to take ffmpeg/node artifacts from (empty = build)
        required: false
        default: ''
      force_rebuild_sidecars:
        description: Rebuild sidecars and overwrite their GHCR tags
        type: boolean
        default: false
      tag:
        description: Release tag (v<version>-rc.N)
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: v
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version '$version' is not X.Y.Z"; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$TAG_INPUT"
            [[ -n "$tag" ]] || { echo "::error::tag input is required"; exit 1; }
            [[ "$tag" == "v$version-rc."* ]] || { echo "::error::$tag does not match version $version"; exit 1; }
            prerelease=true
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
            [[ "$tag" == "v$version-rc."* ]] || { echo "::error::$tag does not match version $version"; exit 1; }
            prerelease=true
          else
            tag="v$version"
            subject=$(git log -1 --format=%s)
            [[ "$subject" == "$version" ]] || { echo "::error::commit title '$subject' is not '$version'"; exit 1; }
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::$tag already exists. Bump the version in the PR."; exit 1
            fi
            prerelease=false
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  draft:
    needs: version
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - name: Recreate draft release
        id: create
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          drafts=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id")
          for id in $drafts; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          args=(-f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="$TAG" -f body="See CHANGELOG.md" -F draft=true)
          if [[ "$PRERELEASE" == "true" ]]; then args+=(-F prerelease=true); fi
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" "${args[@]}" --jq .id)
          [[ -n "$id" ]] || { echo "::error::draft release id missing"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  ffmpeg:
    needs: version
    if: ${{ (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            script: scripts/ffmpeg/build-unix.sh
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            script: scripts/ffmpeg/build-unix.sh
          - runner: ubuntu-22.04
            target: x86_64-pc-windows-msvc
            script: scripts/ffmpeg/build-windows.sh
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: macOS toolchain
        if: runner.os == 'macOS'
        run: |
          xcodebuild -version
          clang --version
      - name: Cache ffmpeg downloads and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/not-higgsfield-build/ffmpeg
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('scripts/ffmpeg/**') }}
      - name: Linux packages
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm pkg-config mingw-w64 \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix
          if [[ "$TARGET" == "x86_64-pc-windows-msvc" ]]; then
            sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
            sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          fi
      - name: Compute sidecar key
        id: key
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RUNNER_IMAGE: ${{ matrix.runner }}
        run: |
          key=$(bash .github/scripts/sidecar-key.sh ffmpeg "$TARGET" "$RUNNER_IMAGE" full)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          oras version
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$ACTOR" --password-stdin
      - name: Pull sidecar from GHCR
        id: pull
        shell: bash
        env:
          FORCE: ${{ inputs.force_rebuild_sidecars }}
          KEY: ${{ steps.key.outputs.key }}
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$FORCE" == "true" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if oras pull "ghcr.io/jefoce/not-higgsfield-sidecars:$KEY" -o ghcr-cache; then
            find ghcr-cache -mindepth 2 -type f -exec mv -n {} ghcr-cache/ \;
            find ghcr-cache -mindepth 1 -type d -empty -delete
            bin="ffmpeg-$TARGET"
            if [[ "$TARGET" == *windows* ]]; then bin="$bin.exe"; fi
            if [[ -f "ghcr-cache/$bin" && -f ghcr-cache/manifest.json ]]; then
              echo "found=true" >> "$GITHUB_OUTPUT"
            else
              echo "GHCR tag incomplete, rebuilding"
              echo "found=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Windows buildconf tool
        if: matrix.target == 'x86_64-pc-windows-msvc' && steps.pull.outputs.found != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine64
      - name: Pull ffmpeg sources from GHCR
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        id: sources
        shell: bash
        env:
          FORCE: ${{ inputs.force_rebuild_sidecars }}
          TARGET: ${{ matrix.target }}
        run: |
          source scripts/ffmpeg/versions.env
          tag="ffmpeg-$FFMPEG_VERSION-x264-${X264_COMMIT:0:8}-zlib-$ZLIB_VERSION"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$FORCE" == "true" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if oras pull "ghcr.io/jefoce/not-higgsfield-sources:$tag" -o ghcr-sources; then
            find ghcr-sources -mindepth 2 -type f -exec mv -n {} ghcr-sources/ \;
            find ghcr-sources -mindepth 1 -type d -empty -delete
            if [[ -n "$(find ghcr-sources -maxdepth 1 -type f -name '*.tar.*' -print -quit)" ]]; then
              echo "found=true" >> "$GITHUB_OUTPUT"
              mkdir -p ffmpeg-sources
              cp ghcr-sources/*.tar.* ffmpeg-sources/
              src="$HOME/.cache/not-higgsfield-build/ffmpeg/work/$FFMPEG_VERSION-full-$TARGET/src"
              mkdir -p "$src"
              cp ghcr-sources/*.tar.* "$src"/
            else
              echo "GHCR tag incomplete, rebuilding"
              echo "found=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Use sidecar from GHCR
        if: steps.pull.outputs.found == 'true'
        shell: bash
        env:
          KEY: ${{ steps.key.outputs.key }}
          TARGET: ${{ matrix.target }}
        run: |
          bin="ffmpeg-$TARGET"
          if [[ "$TARGET" == *windows* ]]; then bin="$bin.exe"; fi
          node .github/scripts/sidecar-manifest.mjs verify "ghcr-cache/$bin" ghcr-cache/manifest.json
          mkdir -p ffmpeg-out
          cp "ghcr-cache/$bin" ghcr-cache/manifest.json ffmpeg-out/
          if [[ -f ghcr-cache/buildconf.txt ]]; then cp ghcr-cache/buildconf.txt ffmpeg-out/; fi
          chmod +x "ffmpeg-out/$bin"
          if [[ "$TARGET" == "x86_64-pc-windows-msvc" ]]; then
            echo "verify runs natively in the Windows build job"
          else
            bash scripts/ffmpeg/verify.sh "ffmpeg-out/$bin"
          fi
          echo "from GHCR $KEY"
      - name: Build ffmpeg
        if: steps.pull.outputs.found != 'true' || (matrix.target == 'x86_64-unknown-linux-gnu' && steps.sources.outputs.found != 'true')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SCRIPT: ${{ matrix.script }}
        run: |
          args=(--target "$TARGET" --out ffmpeg-out)
          if [[ "$TARGET" == "x86_64-unknown-linux-gnu" ]]; then
            args+=(--sources ffmpeg-sources)
          fi
          bash "$SCRIPT" "${args[@]}"
      - name: Publish sidecar to GHCR
        if: steps.pull.outputs.found != 'true'
        shell: bash
        env:
          FORCE: ${{ inputs.force_rebuild_sidecars }}
          KEY: ${{ steps.key.outputs.key }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bin="ffmpeg-$TARGET"
          if [[ "$TARGET" == *windows* ]]; then bin="$bin.exe"; fi
          [[ -f ffmpeg-out/buildconf.txt ]] || { echo "::error::buildconf.txt missing"; exit 1; }
          if [[ "$TARGET" != *windows* ]]; then chmod +x "ffmpeg-out/$bin"; fi
          node .github/scripts/sidecar-manifest.mjs write "ffmpeg-out/$bin" ffmpeg-out/manifest.json ffmpeg "$TARGET" "$VERSION" full
          if [[ "$FORCE" != "true" ]] && oras manifest fetch "ghcr.io/jefoce/not-higgsfield-sidecars:$KEY" >/dev/null 2>&1; then
            echo "GHCR tag exists but is incomplete, not overwriting $KEY"
          else
            (cd ffmpeg-out && oras push --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" "ghcr.io/jefoce/not-higgsfield-sidecars:$KEY" "$bin" buildconf.txt manifest.json)
            echo "built and pushed $KEY"
          fi
      - name: Push ffmpeg sources to GHCR
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          FORCE: ${{ inputs.force_rebuild_sidecars }}
        run: |
          source scripts/ffmpeg/versions.env
          tag="ffmpeg-$FFMPEG_VERSION-x264-${X264_COMMIT:0:8}-zlib-$ZLIB_VERSION"
          ref="ghcr.io/jefoce/not-higgsfield-sources:$tag"
          node -e '
            const { createHash } = require("node:crypto")
            const { readdirSync, readFileSync, writeFileSync } = require("node:fs")
            const files = {}
            for (const name of readdirSync("ffmpeg-sources").sort()) {
              files[name] = createHash("sha256").update(readFileSync("ffmpeg-sources/" + name)).digest("hex")
            }
            writeFileSync("ffmpeg-sources-manifest.json", JSON.stringify({ tag: process.argv[1], files }, null, 2) + "\n")
          ' "$tag"
          if [[ "$FORCE" != "true" ]] && oras manifest fetch "$ref" >/dev/null 2>&1; then
            echo "GHCR already has $tag"
          else
            cp ffmpeg-sources-manifest.json ffmpeg-sources/
            (cd ffmpeg-sources && oras push --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" "$ref" -- *.tar.* ffmpeg-sources-manifest.json)
            echo "pushed $tag"
          fi
      # tar keeps the executable bit that upload-artifact drops.
      - name: Pack ffmpeg sidecar
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: tar -czf "ffmpeg-$TARGET.tar.gz" -C ffmpeg-out .
      - name: Upload ffmpeg sidecar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg-${{ matrix.target }}
          path: ffmpeg-${{ matrix.target }}.tar.gz
          if-no-files-found: error
      - name: Upload ffmpeg sources
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg-sources
          path: ffmpeg-sources/*.tar.*
          if-no-files-found: error

  node:
    needs: version
    if: ${{ inputs.node_source != 'official' && (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15 # Node 24.22.1 BUILDING.md requires Xcode >= 16.1.
            target: aarch64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Disable autocrlf
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: macOS toolchain
        if: runner.os == 'macOS'
        run: |
          xcodebuild -version
          clang --version
      - name: Cache Node downloads and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/not-higgsfield-build/node
          key: node-${{ matrix.target }}-${{ hashFiles('scripts/node/**') }}
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 xz-utils gcc-12 g++-12
      - name: Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Compute sidecar key
        id: key
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RUNNER_IMAGE: ${{ matrix.runner }}
        run: |
          key=$(bash .github/scripts/sidecar-key.sh node "$TARGET" "$RUNNER_IMAGE")
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          oras version
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$ACTOR" --password-stdin
      - name: Pull sidecar from GHCR
        id: pull
        shell: bash
        env:
          FORCE: ${{ inputs.force_rebuild_sidecars }}
          KEY: ${{ steps.key.outputs.key }}
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$FORCE" == "true" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if oras pull "ghcr.io/jefoce/not-higgsfield-sidecars:$KEY" -o ghcr-cache; then
            find ghcr-cache -mindepth 2 -type f -exec mv -n {} ghcr-cache/ \;
            find ghcr-cache -mindepth 1 -type d -empty -delete
            bin="not-higgsfield-server-$TARGET"
            if [[ "$TARGET" == *windows* ]]; then bin="$bin.exe"; fi
            if [[ -f "ghcr-cache/$bin" && -f ghcr-cache/manifest.json ]]; then
              echo "found=true" >> "$GITHUB_OUTPUT"
            else
              echo "GHCR tag incomplete, rebuilding"
              echo "found=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Use sidecar from GHCR
        if: steps.pull.outputs.found == 'true'
        shell: bash
        env:
          KEY: ${{ steps.key.outputs.key }}
          TARGET: ${{ matrix.target }}
        run: |
          bin="not-higgsfield-server-$TARGET"
          if [[ "$TARGET" == *windows* ]]; then bin="$bin.exe"; fi
          node .github/scripts/sidecar-manifest.mjs verify "ghcr-cache/$bin" ghcr-cache/manifest.json
          mkdir -p node-out
          cp "ghcr-cache/$bin" ghcr-cache/manifest.json node-out/
          chmod +x "node-out/$bin"
          bash scripts/node/verify.sh "node-out/$bin"
          echo "from GHCR $KEY"
      - name: Build Node (Linux)
        if: runner.os == 'Linux' && steps.pull.outputs.found != 'true'
        shell: bash
        env:
          CC: gcc-12
          CXX: g++-12
          TARGET: ${{ matrix.target }}
        run: bash scripts/node/build-unix.sh --target "$TARGET" --out node-out
      - name: Build Node (macOS)
        if: runner.os == 'macOS' && steps.pull.outputs.found != 'true'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/node/build-unix.sh --target "$TARGET" --out node-out
      - name: Build Node (Windows)
        if: runner.os == 'Windows' && steps.pull.outputs.found != 'true'
        shell: pwsh
        run: ./scripts/node/build-windows.ps1 -Out node-out
      - name: Publish sidecar to GHCR
        if: steps.pull.outputs.found != 'true'
        shell: bash
        env:
          FORCE: ${{ inputs.force_rebuild_sidecars }}
          KEY: ${{ steps.key.outputs.key }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bin="not-higgsfield-server-$TARGET"
          if [[ "$TARGET" == *windows* ]]; then bin="$bin.exe"; fi
          if [[ "$TARGET" != *windows* ]]; then chmod +x "node-out/$bin"; fi
          node .github/scripts/sidecar-manifest.mjs write "node-out/$bin" node-out/manifest.json node "$TARGET" "$VERSION"
          if [[ "$FORCE" != "true" ]] && oras manifest fetch "ghcr.io/jefoce/not-higgsfield-sidecars:$KEY" >/dev/null 2>&1; then
            echo "GHCR tag exists but is incomplete, not overwriting $KEY"
          else
            (cd node-out && oras push --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" "ghcr.io/jefoce/not-higgsfield-sidecars:$KEY" "$bin" manifest.json)
            echo "built and pushed $KEY"
          fi
      # tar keeps the executable bit that upload-artifact drops.
      - name: Pack Node sidecar
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: tar -czf "node-$TARGET.tar.gz" -C node-out .
      - name: Upload Node sidecar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-${{ matrix.target }}
          path: node-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  build:
    needs: [version, draft, ffmpeg, node]
    permissions:
      actions: read
      contents: write
      packages: write
    if: |
      !cancelled() &&
      needs.version.result == 'success' &&
      needs.draft.result == 'success' &&
      (needs.ffmpeg.result == 'success' || (needs.ffmpeg.result == 'skipped' && (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) != '')) &&
      (needs.node.result == 'success' || needs.node.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Disable autocrlf
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        if: (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) != ''
      - name: Log in to GHCR
        if: (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          oras version
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$ACTOR" --password-stdin
      - name: macOS toolchain
        if: runner.os == 'macOS'
        run: |
          xcodebuild -version
          clang --version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Cache build downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/not-higgsfield-build
          key: node-24.22.1-${{ matrix.target }}
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get remove -y 'libunwind-*-dev' || true
          apt-cache policy libunwind-dev
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        continue-on-error: true
        run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck
      - if: runner.os == 'Linux'
        run: pnpm lint
      - run: pnpm deps
      - if: runner.os == 'Linux'
        run: pnpm format:check
      - run: pnpm knip
      - run: pnpm test
      - name: Sidecar source
        shell: bash
        env:
          INPUT_RUN: ${{ inputs.reuse_sidecars_run_id }}
          VARIABLE_RUN: ${{ vars.SIDECARS_RUN_ID }}
        run: |
          if [[ -n "$INPUT_RUN" ]]; then
            echo "sidecars from run $INPUT_RUN (workflow input)"
          elif [[ -n "$VARIABLE_RUN" ]]; then
            echo "sidecars from run $VARIABLE_RUN (repository variable)"
          else
            echo "sidecars built in this run"
          fi
      - name: Download ffmpeg sidecar
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ffmpeg-${{ matrix.target }}
          path: ${{ (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) != '' && 'ffmpeg-out' || 'ffmpeg-artifact' }}
          run-id: ${{ inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract ffmpeg sidecar
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p ffmpeg-out
          if [[ -f "ffmpeg-artifact/ffmpeg-$TARGET.tar.gz" ]]; then
            tar -xzf "ffmpeg-artifact/ffmpeg-$TARGET.tar.gz" -C ffmpeg-out
          elif [[ -f "ffmpeg-out/ffmpeg-$TARGET.tar.gz" ]]; then
            tar -xzf "ffmpeg-out/ffmpeg-$TARGET.tar.gz" -C ffmpeg-out
            rm "ffmpeg-out/ffmpeg-$TARGET.tar.gz"
          fi
      - name: Restore ffmpeg executable bit
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: chmod +x "ffmpeg-out/ffmpeg-$TARGET"
      - name: Verify ffmpeg sidecar
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          exe=""
          if [[ "$TARGET" == *windows* ]]; then exe=".exe"; fi
          bash scripts/ffmpeg/verify.sh "ffmpeg-out/ffmpeg-$TARGET${exe}"
      - name: Set FFMPEG_BINARY
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          exe=""
          if [[ "$TARGET" == *windows* ]]; then exe=".exe"; fi
          echo "FFMPEG_BINARY=$GITHUB_WORKSPACE/ffmpeg-out/ffmpeg-$TARGET${exe}" >> "$GITHUB_ENV"
      - name: Download Node sidecar
        if: needs.node.result == 'success' || (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: node-${{ matrix.target }}
          path: ${{ (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) != '' && 'node-out' || 'node-artifact' }}
          run-id: ${{ inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Node sidecar
        if: needs.node.result == 'success' || (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) != ''
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p node-out
          if [[ -f "node-artifact/node-$TARGET.tar.gz" ]]; then
            tar -xzf "node-artifact/node-$TARGET.tar.gz" -C node-out
          elif [[ -f "node-out/node-$TARGET.tar.gz" ]]; then
            tar -xzf "node-out/node-$TARGET.tar.gz" -C node-out
            rm "node-out/node-$TARGET.tar.gz"
          fi
      - name: Restore Node executable bit
        if: (needs.node.result == 'success' || (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) != '') && runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: chmod +x "node-out/not-higgsfield-server-$TARGET"
      - name: Set NODE_BINARY
        if: needs.node.result == 'success' || (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) != ''
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          exe=""
          if [[ "$TARGET" == *windows* ]]; then exe=".exe"; fi
          echo "NODE_BINARY=$GITHUB_WORKSPACE/node-out/not-higgsfield-server-$TARGET${exe}" >> "$GITHUB_ENV"
      - name: Verify Node sidecar
        if: needs.node.result == 'success' || (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) != ''
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          exe=""
          if [[ "$TARGET" == *windows* ]]; then exe=".exe"; fi
          bash scripts/node/verify.sh "node-out/not-higgsfield-server-$TARGET${exe}"
      - name: Push reused sidecars to GHCR
        if: (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) != ''
        shell: bash
        env:
          REUSE_RUN: ${{ inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            aarch64-apple-darwin) ff_runner=macos-15; node_runner=macos-15 ;;
            x86_64-unknown-linux-gnu) ff_runner=ubuntu-22.04; node_runner=ubuntu-22.04 ;;
            x86_64-pc-windows-msvc) ff_runner=ubuntu-22.04; node_runner=windows-latest ;;
            *) echo "::error::unsupported target $TARGET"; exit 1 ;;
          esac
          exe=""
          if [[ "$TARGET" == *windows* ]]; then exe=".exe"; fi
          ff_key=$(bash .github/scripts/sidecar-key.sh ffmpeg "$TARGET" "$ff_runner" full)
          node_key=$(bash .github/scripts/sidecar-key.sh node "$TARGET" "$node_runner")
          if [[ ! -f ffmpeg-out/buildconf.txt ]]; then
            "ffmpeg-out/ffmpeg-$TARGET$exe" -hide_banner -buildconf | tr -d '\r' > ffmpeg-out/buildconf.txt
          fi
          node .github/scripts/sidecar-manifest.mjs write "ffmpeg-out/ffmpeg-$TARGET$exe" ffmpeg-out/manifest.json ffmpeg "$TARGET" "$VERSION" full
          node .github/scripts/sidecar-manifest.mjs write "node-out/not-higgsfield-server-$TARGET$exe" node-out/manifest.json node "$TARGET" "$VERSION"
          if oras manifest fetch "ghcr.io/jefoce/not-higgsfield-sidecars:$ff_key" >/dev/null 2>&1; then
            echo "GHCR already has $ff_key"
          else
            (cd ffmpeg-out && oras push --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" "ghcr.io/jefoce/not-higgsfield-sidecars:$ff_key" "ffmpeg-$TARGET$exe" buildconf.txt manifest.json)
            echo "reused run $REUSE_RUN, pushed $ff_key"
          fi
          if oras manifest fetch "ghcr.io/jefoce/not-higgsfield-sidecars:$node_key" >/dev/null 2>&1; then
            echo "GHCR already has $node_key"
          else
            (cd node-out && oras push --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" "ghcr.io/jefoce/not-higgsfield-sidecars:$node_key" "not-higgsfield-server-$TARGET$exe" manifest.json)
            echo "reused run $REUSE_RUN, pushed $node_key"
          fi
      - name: Download reused ffmpeg sources
        if: matrix.target == 'x86_64-unknown-linux-gnu' && (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ffmpeg-sources
          path: reuse-sources
          run-id: ${{ inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Push reused ffmpeg sources to GHCR
        if: matrix.target == 'x86_64-unknown-linux-gnu' && (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) != ''
        shell: bash
        env:
          REUSE_RUN: ${{ inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID }}
        run: |
          set -euo pipefail
          source scripts/ffmpeg/versions.env
          tag="ffmpeg-$FFMPEG_VERSION-x264-${X264_COMMIT:0:8}-zlib-$ZLIB_VERSION"
          ref="ghcr.io/jefoce/not-higgsfield-sources:$tag"
          node -e '
            const { createHash } = require("node:crypto")
            const { readdirSync, readFileSync, writeFileSync } = require("node:fs")
            const files = {}
            for (const name of readdirSync("reuse-sources").sort()) {
              files[name] = createHash("sha256").update(readFileSync("reuse-sources/" + name)).digest("hex")
            }
            writeFileSync("ffmpeg-sources-manifest.json", JSON.stringify({ tag: process.argv[1], files }, null, 2) + "\n")
          ' "$tag"
          if oras manifest fetch "$ref" >/dev/null 2>&1; then
            echo "GHCR already has $tag"
          else
            cp ffmpeg-sources-manifest.json reuse-sources/
            (cd reuse-sources && oras push --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" "$ref" -- *.tar.* ffmpeg-sources-manifest.json)
            echo "reused run $REUSE_RUN, pushed $tag"
          fi
      - name: Allow official Node
        if: needs.node.result == 'skipped' && (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) == ''
        shell: bash
        run: echo "ALLOW_OFFICIAL_NODE=1" >> "$GITHUB_ENV"
      - name: Stage server
        run: pnpm desktop:prepare
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
      - name: Smoke test packaged server
        env:
          TARGET: ${{ matrix.target }}
        run: node scripts/smoke-server.mjs --target "$TARGET"
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          NH_PREPARED: 1
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }} --config src-tauri/tauri.updater.conf.json
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bundle="src-tauri/target/$TARGET/release/bundle"
          app=$(find "$bundle/macos" -maxdepth 1 -name '*.app' -print -quit)
          mount=""
          trap 'if [[ -n "$mount" ]]; then hdiutil detach "$mount" >/dev/null 2>&1 || true; fi' EXIT
          if [[ -z "$app" ]]; then
            dmg=$(find "$bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)
            [[ -n "$dmg" ]] || { echo "::error::no macOS app or dmg found"; exit 1; }
            mount=$(mktemp -d)
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount" >/dev/null
            app=$(find "$mount" -maxdepth 1 -name '*.app' -print -quit)
          fi
          [[ -n "$app" ]] || { echo "::error::no .app found"; exit 1; }
          codesign --verify --deep --strict "$app"
          spctl --assess --verbose "$app" || true
      - name: Rename installers
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            aarch64-apple-darwin) platform=macos; arch=arm64 ;;
            x86_64-pc-windows-msvc) platform=windows; arch=x64 ;;
            x86_64-unknown-linux-gnu) platform=linux; arch=x64 ;;
            *) echo "::error::unsupported target $TARGET"; exit 1 ;;
          esac
          bundle="src-tauri/target/$TARGET/release/bundle"
          mkdir -p dist
          find "$bundle" -type f \
            \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.app.tar.gz' \) \
            | sort \
            | while IFS= read -r file; do
                case "$file" in
                  *-setup.exe) suffix="-setup.exe" ;;
                  *.dmg) suffix=".dmg" ;;
                  *.AppImage) suffix=".AppImage" ;;
                  *.deb) suffix=".deb" ;;
                  *.rpm) suffix=".rpm" ;;
                  *.app.tar.gz) suffix=".app.tar.gz" ;;
                  *) continue ;;
                esac
                dest="dist/not-higgsfield-${VERSION}-${platform}-${arch}${suffix}"
                mv "$file" "$dest"
                case "$suffix" in
                  -setup.exe|.AppImage|.app.tar.gz)
                    [[ -f "$file.sig" ]] || { echo "::error::missing updater signature for $file"; exit 1; }
                    mv "$file.sig" "$dest.sig"
                    ;;
                esac
              done
          ls -l dist
      - name: Upload installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.id }}
        run: |
          set -euo pipefail
          if [[ -z "$(ls -A dist 2>/dev/null)" ]]; then echo "::error::no installers to upload"; exit 1; fi
          bash .github/scripts/upload-release-assets.sh "$RELEASE_ID" dist/*
      - name: Checksums for this build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          out="sha256-$TARGET.txt"
          (cd dist && if command -v sha256sum >/dev/null; then sha256sum -- *; else shasum -a 256 -- *; fi) > "$out"
          cat "$out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sha256-${{ matrix.target }}
          path: sha256-${{ matrix.target }}.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: updater-sig-${{ matrix.target }}
          path: dist/*.sig
          if-no-files-found: error

  checksums:
    needs: [version, draft, build]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.draft.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          oras version
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$ACTOR" --password-stdin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sha256-*
          path: dist
          merge-multiple: true
      - name: Pull ffmpeg sources from GHCR
        id: sources
        shell: bash
        run: |
          source scripts/ffmpeg/versions.env
          tag="ffmpeg-$FFMPEG_VERSION-x264-${X264_COMMIT:0:8}-zlib-$ZLIB_VERSION"
          if oras pull "ghcr.io/jefoce/not-higgsfield-sources:$tag" -o sources; then
            find sources -mindepth 2 -type f -exec mv -n {} sources/ \;
            find sources -mindepth 1 -type d -empty -delete
            if [[ -n "$(find sources -maxdepth 1 -type f -name '*.tar.*' -print -quit)" ]]; then
              rm -f sources/manifest.json sources/ffmpeg-sources-manifest.json
              echo "found=true" >> "$GITHUB_OUTPUT"
            else
              echo "GHCR tag incomplete, rebuilding"
              rm -f sources/manifest.json sources/ffmpeg-sources-manifest.json
              echo "found=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.sources.outputs.found != 'true'
        with:
          name: ffmpeg-sources
          path: sources
          run-id: ${{ inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge and upload SHA256SUMS.txt with ffmpeg sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.id }}
        run: |
          set -euo pipefail
          archive=$(find sources -maxdepth 1 -type f -name '*.tar.*' -print -quit)
          [[ -n "$archive" ]] || { echo "::error::no ffmpeg source archives found"; exit 1; }
          sort dist/*.txt > SHA256SUMS.txt
          (cd sources && shasum -a 256 -- *.tar.*) >> "$GITHUB_WORKSPACE/SHA256SUMS.txt"
          sort -o SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt
          bash .github/scripts/upload-release-assets.sh "$RELEASE_ID" SHA256SUMS.txt sources/*.tar.*

  updater-manifest:
    needs: [version, draft, build]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.draft.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Job start
        shell: bash
        run: echo "JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download updater signatures
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: updater-sig-*
          path: updater-sigs
          merge-multiple: true
      - name: Write latest.json
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node .github/scripts/updater-manifest.mjs \
            --version "$VERSION" \
            --tag "$TAG" \
            --repo "$REPO" \
            --changelog CHANGELOG.md \
            --pub-date "$JOB_STARTED_AT" \
            --signatures updater-sigs \
            --out latest.json
          cat latest.json
      - name: Upload latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.id }}
        run: bash .github/scripts/upload-release-assets.sh "$RELEASE_ID" latest.json

  tag:
    needs: [version, build, checksums, updater-manifest]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/releases' && needs.version.result == 'success' && needs.build.result == 'success' && needs.checksums.result == 'success' && needs.updater-manifest.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create release tag after all jobs pass
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            target=$(git rev-list -n 1 "refs/tags/$TAG")
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "::error::$TAG exists and points to $target, not $GITHUB_SHA"; exit 1
            fi
            echo "$TAG already points to $GITHUB_SHA"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
