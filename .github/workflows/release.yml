name: release
run-name: >-
  Release ${{ inputs.tag
  || startsWith(github.ref, 'refs/tags/') && github.ref_name
  || github.event.head_commit.message }}

on:
  push:
    branches: [releases]
    tags: ['v*-rc.*']
  workflow_dispatch:
    inputs:
      node_source:
        description: Node.js binary source
        type: choice
        options: [custom, official]
        default: custom
      reuse_sidecars_run_id:
        description: Run ID to take ffmpeg/node artifacts from (empty = build)
        required: false
        default: ''
      force_rebuild_sidecars:
        description: Rebuild sidecars and overwrite their GHCR tags
        type: boolean
        default: false
      tag:
        description: Release tag (v<version>-rc.N)
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: v
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: bash .github/scripts/release-version.sh >> "$GITHUB_OUTPUT"

  draft:
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - name: Recreate draft release
        id: create
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: bash .github/scripts/release-draft.sh >> "$GITHUB_OUTPUT"

  ffmpeg:
    needs: version
    if: ${{ (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            script: scripts/ffmpeg/build-unix.sh
            exe: ''
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            script: scripts/ffmpeg/build-unix.sh
            exe: ''
          - runner: ubuntu-22.04
            target: x86_64-pc-windows-msvc
            script: scripts/ffmpeg/build-windows.sh
            exe: '.exe'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: macOS toolchain
        if: runner.os == 'macOS'
        run: |
          xcodebuild -version
          clang --version
      - name: Cache ffmpeg downloads and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/not-higgsfield-build/ffmpeg
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('scripts/ffmpeg/**') }}
      - name: Linux packages
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm pkg-config mingw-w64 \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix
          if [[ "$TARGET" == "x86_64-pc-windows-msvc" ]]; then
            sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
            sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          fi
      - uses: ./.github/actions/sidecar-restore
        id: pull
        with:
          name: ffmpeg
          target: ${{ matrix.target }}
          runner: ${{ matrix.runner }}
          profile: full
          force: ${{ inputs.force_rebuild_sidecars }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Windows buildconf tool
        if: matrix.target == 'x86_64-pc-windows-msvc' && steps.pull.outputs.found != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine64
      - name: Pull ffmpeg sources from GHCR
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        id: sources
        shell: bash
        env:
          FORCE: ${{ inputs.force_rebuild_sidecars }}
          TARGET: ${{ matrix.target }}
        run: |
          tag=$(bash .github/scripts/ffmpeg-sources-tag.sh)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$FORCE" == "true" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          found=$(bash .github/scripts/ghcr-pull.sh "ghcr.io/jefoce/not-higgsfield-sources:$tag" ghcr-sources '*.tar.*')
          echo "found=$found" >> "$GITHUB_OUTPUT"
          if [[ "$found" == "true" ]]; then
            source scripts/ffmpeg/versions.env
            mkdir -p ffmpeg-sources
            cp ghcr-sources/*.tar.* ffmpeg-sources/
            src="$HOME/.cache/not-higgsfield-build/ffmpeg/work/$FFMPEG_VERSION-full-$TARGET/src"
            mkdir -p "$src"
            cp ghcr-sources/*.tar.* "$src"/
          fi
      - name: Build ffmpeg
        if: steps.pull.outputs.found != 'true' || (matrix.target == 'x86_64-unknown-linux-gnu' && steps.sources.outputs.found != 'true')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SCRIPT: ${{ matrix.script }}
        run: |
          args=(--target "$TARGET" --out ffmpeg-out)
          if [[ "$TARGET" == "x86_64-unknown-linux-gnu" ]]; then
            args+=(--sources ffmpeg-sources)
          fi
          bash "$SCRIPT" "${args[@]}"
      - uses: ./.github/actions/sidecar-publish
        with:
          name: ffmpeg
          target: ${{ matrix.target }}
          version: ${{ needs.version.outputs.version }}
          profile: full
          key: ${{ steps.pull.outputs.key }}
          force: ${{ inputs.force_rebuild_sidecars }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: ffmpeg-${{ matrix.target }}${{ matrix.exe }} buildconf.txt manifest.json
      - name: Push ffmpeg sources to GHCR
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          FORCE: ${{ inputs.force_rebuild_sidecars }}
        run: |
          tag=$(bash .github/scripts/ffmpeg-sources-tag.sh)
          ref="ghcr.io/jefoce/not-higgsfield-sources:$tag"
          archives=(ffmpeg-sources/*.tar.*)
          node .github/scripts/sources-manifest.mjs ffmpeg-sources "$tag"
          bash .github/scripts/ghcr-push.sh "$ref" ffmpeg-sources "${archives[@]##*/}" ffmpeg-sources-manifest.json
      - name: Upload ffmpeg sources
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg-sources
          path: ffmpeg-sources/*.tar.*
          if-no-files-found: error

  node:
    needs: version
    if: ${{ inputs.node_source != 'official' && (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15 # Node 24.22.1 BUILDING.md requires Xcode >= 16.1.
            target: aarch64-apple-darwin
            exe: ''
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: ''
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            exe: '.exe'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    steps:
      - name: Disable autocrlf
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: macOS toolchain
        if: runner.os == 'macOS'
        run: |
          xcodebuild -version
          clang --version
      - name: Cache Node downloads and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/not-higgsfield-build/node
          key: node-${{ matrix.target }}-${{ hashFiles('scripts/node/**') }}
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 xz-utils gcc-12 g++-12
      - name: Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: ./.github/actions/sidecar-restore
        id: pull
        with:
          name: node
          target: ${{ matrix.target }}
          runner: ${{ matrix.runner }}
          force: ${{ inputs.force_rebuild_sidecars }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Node (Linux)
        if: runner.os == 'Linux' && steps.pull.outputs.found != 'true'
        shell: bash
        env:
          CC: gcc-12
          CXX: g++-12
          TARGET: ${{ matrix.target }}
        run: bash scripts/node/build-unix.sh --target "$TARGET" --out node-out
      - name: Build Node (macOS)
        if: runner.os == 'macOS' && steps.pull.outputs.found != 'true'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/node/build-unix.sh --target "$TARGET" --out node-out
      - name: Build Node (Windows)
        if: runner.os == 'Windows' && steps.pull.outputs.found != 'true'
        shell: pwsh
        run: ./scripts/node/build-windows.ps1 -Out node-out
      - uses: ./.github/actions/sidecar-publish
        with:
          name: node
          target: ${{ matrix.target }}
          version: ${{ needs.version.outputs.version }}
          key: ${{ steps.pull.outputs.key }}
          force: ${{ inputs.force_rebuild_sidecars }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: not-higgsfield-server-${{ matrix.target }}${{ matrix.exe }} manifest.json

  build:
    needs: [version, draft, ffmpeg, node]
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
      # Only the reuse path pushes sidecars. Job permissions cannot be conditional.
      packages: write
    if: |
      !cancelled() &&
      needs.version.result == 'success' &&
      needs.draft.result == 'success' &&
      (needs.ffmpeg.result == 'success' || (needs.ffmpeg.result == 'skipped' && (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) != '')) &&
      (needs.node.result == 'success' || needs.node.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            exe: ''
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            exe: '.exe'
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Disable autocrlf
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        if: (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) != ''
      - name: Log in to GHCR
        if: (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          oras version
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$ACTOR" --password-stdin
      - name: macOS toolchain
        if: runner.os == 'macOS'
        run: |
          xcodebuild -version
          clang --version
      - uses: ./.github/actions/setup-pnpm
        with:
          install: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Cache build downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/not-higgsfield-build
          key: node-24.22.1-${{ matrix.target }}
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get remove -y 'libunwind-*-dev' || true
          apt-cache policy libunwind-dev
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        continue-on-error: true
        run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck
      - if: runner.os == 'Linux'
        run: pnpm lint
      - run: pnpm deps
      - if: runner.os == 'Linux'
        run: pnpm format:check
      - run: pnpm knip
      - run: pnpm test
      - name: Sidecar source
        shell: bash
        env:
          INPUT_RUN: ${{ inputs.reuse_sidecars_run_id }}
          VARIABLE_RUN: ${{ vars.SIDECARS_RUN_ID }}
        run: |
          if [[ -n "$INPUT_RUN" ]]; then
            echo "sidecars from run $INPUT_RUN (workflow input)"
          elif [[ -n "$VARIABLE_RUN" ]]; then
            echo "sidecars from run $VARIABLE_RUN (repository variable)"
          else
            echo "sidecars built in this run"
          fi
      - name: Download ffmpeg sidecar
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ffmpeg-${{ matrix.target }}
          path: ${{ (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) != '' && 'ffmpeg-out' || 'ffmpeg-artifact' }}
          run-id: ${{ inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage ffmpeg sidecar
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
          ARTIFACT_DIR: ${{ (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) != '' && 'ffmpeg-out' || 'ffmpeg-artifact' }}
        run: bash .github/scripts/stage-sidecar.sh ffmpeg "$TARGET" "$ARTIFACT_DIR" ffmpeg-out
      - name: Download Node sidecar
        if: needs.node.result == 'success' || (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: node-${{ matrix.target }}
          path: ${{ (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) != '' && 'node-out' || 'node-artifact' }}
          run-id: ${{ inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage Node sidecar
        if: needs.node.result == 'success' || (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) != ''
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
          ARTIFACT_DIR: ${{ (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) != '' && 'node-out' || 'node-artifact' }}
        run: bash .github/scripts/stage-sidecar.sh node "$TARGET" "$ARTIFACT_DIR" node-out
      - name: Push reused sidecars to GHCR
        if: (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) != ''
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          runners=$(bash .github/scripts/target-runners.sh "$TARGET")
          read -r ff_runner node_runner <<< "$runners"
          ff_key=$(bash .github/scripts/sidecar-key.sh ffmpeg "$TARGET" "$ff_runner" full)
          node_key=$(bash .github/scripts/sidecar-key.sh node "$TARGET" "$node_runner")
          if [[ ! -f ffmpeg-out/buildconf.txt ]]; then
            "ffmpeg-out/ffmpeg-$TARGET$EXE" -hide_banner -buildconf | tr -d '\r' > ffmpeg-out/buildconf.txt
          fi
          node .github/scripts/sidecar-manifest.mjs write "ffmpeg-out/ffmpeg-$TARGET$EXE" ffmpeg-out/manifest.json ffmpeg "$TARGET" "$VERSION" full
          node .github/scripts/sidecar-manifest.mjs write "node-out/not-higgsfield-server-$TARGET$EXE" node-out/manifest.json node "$TARGET" "$VERSION"
          bash .github/scripts/ghcr-push.sh "ghcr.io/jefoce/not-higgsfield-sidecars:$ff_key" ffmpeg-out "ffmpeg-$TARGET$EXE" buildconf.txt manifest.json
          bash .github/scripts/ghcr-push.sh "ghcr.io/jefoce/not-higgsfield-sidecars:$node_key" node-out "not-higgsfield-server-$TARGET$EXE" manifest.json
      - name: Download reused ffmpeg sources
        if: matrix.target == 'x86_64-unknown-linux-gnu' && (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ffmpeg-sources
          path: reuse-sources
          run-id: ${{ inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Push reused ffmpeg sources to GHCR
        if: matrix.target == 'x86_64-unknown-linux-gnu' && (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) != ''
        shell: bash
        run: |
          set -euo pipefail
          tag=$(bash .github/scripts/ffmpeg-sources-tag.sh)
          ref="ghcr.io/jefoce/not-higgsfield-sources:$tag"
          archives=(reuse-sources/*.tar.*)
          node .github/scripts/sources-manifest.mjs reuse-sources "$tag"
          bash .github/scripts/ghcr-push.sh "$ref" reuse-sources "${archives[@]##*/}" ffmpeg-sources-manifest.json
      - name: Allow official Node
        if: needs.node.result == 'skipped' && (inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID) == ''
        shell: bash
        run: echo "ALLOW_OFFICIAL_NODE=1" >> "$GITHUB_ENV"
      - name: Stage server
        run: pnpm desktop:prepare
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
      - name: Smoke test packaged server
        env:
          TARGET: ${{ matrix.target }}
        run: node scripts/smoke-server.mjs --target "$TARGET"
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          NH_PREPARED: 1
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }} --config src-tauri/tauri.updater.conf.json
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bundle="src-tauri/target/$TARGET/release/bundle"
          app=$(find "$bundle/macos" -maxdepth 1 -name '*.app' -print -quit)
          mount=""
          trap 'if [[ -n "$mount" ]]; then hdiutil detach "$mount" >/dev/null 2>&1 || true; fi' EXIT
          if [[ -z "$app" ]]; then
            dmg=$(find "$bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)
            [[ -n "$dmg" ]] || { echo "::error::no macOS app or dmg found"; exit 1; }
            mount=$(mktemp -d)
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount" >/dev/null
            app=$(find "$mount" -maxdepth 1 -name '*.app' -print -quit)
          fi
          [[ -n "$app" ]] || { echo "::error::no .app found"; exit 1; }
          codesign --verify --deep --strict "$app"
          spctl --assess --verbose "$app" || true
      - name: Rename installers
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: bash .github/scripts/rename-installers.sh "src-tauri/target/$TARGET/release/bundle" "$VERSION" "$TARGET" dist
      - name: Upload installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.id }}
        run: |
          set -euo pipefail
          if [[ -z "$(ls -A dist 2>/dev/null)" ]]; then echo "::error::no installers to upload"; exit 1; fi
          bash .github/scripts/upload-release-assets.sh "$RELEASE_ID" dist/*
      - name: Checksums for this build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash .github/scripts/checksums.sh build "$TARGET" dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sha256-${{ matrix.target }}
          path: sha256-${{ matrix.target }}.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: updater-sig-${{ matrix.target }}
          path: dist/*.sig
          if-no-files-found: error

  checksums:
    needs: [version, draft, build]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.draft.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          oras version
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$ACTOR" --password-stdin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sha256-*
          path: dist
          merge-multiple: true
      - name: Pull ffmpeg sources from GHCR
        id: sources
        shell: bash
        run: |
          tag=$(bash .github/scripts/ffmpeg-sources-tag.sh)
          found=$(bash .github/scripts/ghcr-pull.sh "ghcr.io/jefoce/not-higgsfield-sources:$tag" sources '*.tar.*')
          rm -f sources/manifest.json sources/ffmpeg-sources-manifest.json
          echo "found=$found" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.sources.outputs.found != 'true'
        with:
          name: ffmpeg-sources
          path: sources
          run-id: ${{ inputs.reuse_sidecars_run_id || vars.SIDECARS_RUN_ID || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge and upload SHA256SUMS.txt with ffmpeg sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.id }}
        run: |
          bash .github/scripts/checksums.sh merge dist sources
          bash .github/scripts/upload-release-assets.sh "$RELEASE_ID" SHA256SUMS.txt sources/*.tar.*

  updater-manifest:
    needs: [version, draft, build]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.draft.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Job start
        shell: bash
        run: echo "JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Download updater signatures
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: updater-sig-*
          path: updater-sigs
          merge-multiple: true
      - name: Write latest.json
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node .github/scripts/updater-manifest.mjs \
            --version "$VERSION" \
            --tag "$TAG" \
            --repo "$REPO" \
            --changelog CHANGELOG.md \
            --pub-date "$JOB_STARTED_AT" \
            --signatures updater-sigs \
            --out latest.json
          cat latest.json
      - name: Upload latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.id }}
        run: bash .github/scripts/upload-release-assets.sh "$RELEASE_ID" latest.json

  tag:
    needs: [version, build, checksums, updater-manifest]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/releases' && needs.version.result == 'success' && needs.build.result == 'success' && needs.checksums.result == 'success' && needs.updater-manifest.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create release tag after all jobs pass
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            target=$(git rev-list -n 1 "refs/tags/$TAG")
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "::error::$TAG exists and points to $target, not $GITHUB_SHA"; exit 1
            fi
            echo "$TAG already points to $GITHUB_SHA"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
