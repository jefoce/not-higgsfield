name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ffmpeg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            script: scripts/ffmpeg/build-unix.sh
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            script: scripts/ffmpeg/build-unix.sh
          - runner: ubuntu-22.04
            target: x86_64-pc-windows-msvc
            script: scripts/ffmpeg/build-windows.sh
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_SOURCES_URL: https://github.com/${{ github.repository }}/releases/download/build-sources
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Cache ffmpeg downloads and build
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/not-higgsfield-build/ffmpeg
            ffmpeg-out
            ffmpeg-sources
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('scripts/ffmpeg/**') }}
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm pkg-config mingw-w64 \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix
          if [[ "${{ matrix.target }}" == "x86_64-pc-windows-msvc" ]]; then
            sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
            sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          fi
      - name: Build ffmpeg
        shell: bash
        run: |
          args=(--target "${{ matrix.target }}" --out ffmpeg-out)
          if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-gnu" ]]; then
            args+=(--sources ffmpeg-sources)
          fi
          bash "${{ matrix.script }}" "${args[@]}"
      - name: Upload ffmpeg sidecar
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ffmpeg-${{ matrix.target }}
          path: ffmpeg-out/ffmpeg-${{ matrix.target }}*
          if-no-files-found: error
      - name: Upload ffmpeg sources
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ffmpeg-sources
          path: ffmpeg-sources/*
          if-no-files-found: error

  build:
    needs: ffmpeg
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri
      - name: Cache build downloads
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/not-higgsfield-build
          key: node-22.23.3-${{ matrix.target }}
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        continue-on-error: true
        run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm test
      - name: Download ffmpeg sidecar
        uses: actions/download-artifact@v4.3.0
        with:
          name: ffmpeg-${{ matrix.target }}
          path: ffmpeg-out
      - name: Verify ffmpeg sidecar
        shell: bash
        run: |
          exe=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then exe=".exe"; fi
          bash scripts/ffmpeg/verify.sh "ffmpeg-out/ffmpeg-${{ matrix.target }}${exe}"
      - name: Set FFMPEG_BINARY
        shell: bash
        run: |
          exe=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then exe=".exe"; fi
          echo "FFMPEG_BINARY=$GITHUB_WORKSPACE/ffmpeg-out/ffmpeg-${{ matrix.target }}${exe}" >> "$GITHUB_ENV"
      - name: Stage server
        run: pnpm desktop:prepare
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
      - name: Smoke test packaged server
        run: node scripts/smoke-server.mjs --target ${{ matrix.target }}
      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NH_PREPARED: 1
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Not Higgsfield ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what changed. Install notes are in the README.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
      - name: Checksums for this build
        shell: bash
        run: |
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          out="sha256-${{ matrix.target }}.txt"
          find "$bundle" -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' \) \
            | sort \
            | while IFS= read -r file; do
                if command -v sha256sum >/dev/null; then
                  sha256sum "$file"
                else
                  shasum -a 256 "$file"
                fi | sed 's#  .*/#  #'
              done > "$out"
          cat "$out"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: sha256-${{ matrix.target }}
          path: sha256-${{ matrix.target }}.txt

  checksums:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: sha256-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4.3.0
        with:
          name: ffmpeg-sources
          path: sources
      - name: Merge and upload SHA256SUMS.txt with ffmpeg sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sort dist/*.txt > SHA256SUMS.txt
          (cd sources && shasum -a 256 *) >> "$GITHUB_WORKSPACE/SHA256SUMS.txt"
          sort -o SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt sources/* --repo "$GITHUB_REPOSITORY" --clobber
