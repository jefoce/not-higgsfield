name: setup-pnpm
description: Install pnpm and Node 24 with the pnpm cache, then install dependencies.

inputs:
  install:
    description: true installs all dependencies, prod installs production only, false skips
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm
    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
    - if: inputs.install == 'prod'
      shell: bash
      run: pnpm install --frozen-lockfile --prod
